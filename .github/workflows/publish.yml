name: Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: chmod +x ./gradlew

      - run: ./gradlew build

      - name: Build & Stage
        run: ./gradlew clean publish
        env:
          CI: true
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}

      - name: Inspect bundle
        run: |
            ls -R build/central-staging

      - name: Zip bundle
        run: |
          cd build
          zip -r bundle.zip central-staging

      - name: Upload to Maven Central
        run: |
          curl -f -X POST "https://central.sonatype.com/api/v1/publisher/upload" \
            -u "${CENTRAL_USER}:${CENTRAL_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary "@build/bundle.zip"
        env:
          CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
